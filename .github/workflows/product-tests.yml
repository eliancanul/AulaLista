name: Product tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-service.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-service.lock
      - name: Syntax, whitespace and Django checks
        run: |
          python -m compileall -q aulalista api curriculum health scripts tests
          git diff --check HEAD^ HEAD
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend and compile all Vue modules
        run: |
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run build
          npm --prefix frontend test
          node --test frontend/tests/*.test.mjs
      - name: Require installed Chrome for browser acceptance
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "NIGHT_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "S13_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "S15_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "S20_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "NIGHT_BROWSER_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Required service dependencies
        run: python -c "import django; django.setup(); import fastapi, pydantic, httpx, multipart, api.auth, api.persistence"
        env:
          DJANGO_SETTINGS_MODULE: aulalista.test_settings
      - name: Run full test suite
        run: |
          python -m pytest -q
          python -m pytest tests/s02_test_pdf_timeout.py -q
