{% with route=request.resolver_match.url_name %}
<header class="site-header institutional-header">
  <div class="site-header-inner">
    <a class="wordmark" href="{% url 'tutor-home' %}" aria-label="AulaLista, inicio docente"><span class="brand-symbol" aria-hidden="true">A</span>AulaLista</a>
    <span class="brand-context">Educación · Entorno docente</span>
    <div class="account-actions" aria-label="Cuenta">
      <a class="account-profile-link" href="{% url 'wagtailadmin_account' %}" aria-label="Perfil docente" title="Perfil docente"><svg class="account-profile-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></a>
      <form method="post" action="{% url 'wagtailadmin_logout' %}">{% csrf_token %}<button type="submit">Cerrar sesión</button></form>
    </div>
  </div>
  <div class="navigation-band"><div class="navigation-inner">
    <nav class="top-nav" aria-label="Sección docente">
      <a href="{% url 'tutor-sessions' %}"{% if route == 'tutor-home' or route == 'tutor-sessions' or 'tutor-session-' in route %} aria-current="page"{% endif %}>Sesiones</a>
      <a href="{% url 'tutor-roadmaps' %}"{% if 'tutor-roadmap' in route %} aria-current="page"{% endif %}>Avance curricular</a>
      <a href="{% url 'tutor-curriculum' %}"{% if route == 'tutor-curriculum' or 'tutor-import' in route or route == 'tutor-package-detail' %} aria-current="page"{% endif %}>Currícula y autoría</a>
      <a href="{% url 'tutor-groups' %}"{% if route == 'tutor-groups' or route == 'tutor-group-results' %} aria-current="page"{% endif %}>Salones</a>
      <a href="{% url 'tutor-results' %}"{% if route == 'tutor-results' %} aria-current="page"{% endif %}>Resultados</a>
    </nav>
    <span class="demo-badge">Demostración sintética</span>
  </div></div>
</header>
{% endwith %}
