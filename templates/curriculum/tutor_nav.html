<header class="site-header">
  <div class="site-header-inner">
    <a class="wordmark" href="{% url 'tutor-home' %}" aria-label="AulaLista, inicio docente">Aula<span>Lista</span></a>
    <span class="demo-badge">Demostración sintética</span>
    <nav class="top-nav" aria-label="Sección docente">
      <a href="{% url 'tutor-roadmaps' %}">Avance curricular</a>
      <a href="{% url 'tutor-curriculum' %}">Currícula y autoría</a>
      <a href="{% url 'tutor-import-upload' %}">Importar currícula</a>
      <a href="{% url 'tutor-sessions' %}">Sesiones</a>
      <a href="{% url 'tutor-groups' %}">Salones</a>
      <a href="{% url 'tutor-results' %}">Resultados grupales</a>
    </nav>
    <div class="account-actions" aria-label="Cuenta">
      <a class="account-profile-link" href="{% url 'wagtailadmin_account' %}" aria-label="Perfil docente" title="Perfil docente">
        <svg class="account-profile-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3.25"></circle>
          <path d="M5.5 19.25c.55-3.1 3.1-5 6.5-5s5.95 1.9 6.5 5"></path>
        </svg>
      </a>
      <form method="post" action="{% url 'wagtailadmin_logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
      </form>
    </div>
  </div>
</header>
