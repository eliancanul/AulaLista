<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AulaLista · preparar sesión</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'curriculum/aulalista.css' %}">
  </head>
  <body>
    {% include "curriculum/tutor_nav.html" %}
    <main>
      <h1>Preparar sesión de aula</h1>
      <p>Snapshot publicado: {{ snapshot.payload.title }}</p>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" class="status-card">
        {% csrf_token %}
        <label>
          Número de estudiantes
          <input name="student_count" inputmode="numeric" required>
        </label>
        <label>
          Número de dispositivos
          <input name="device_count" inputmode="numeric" required>
        </label>
        <label>
          Roadmap publicado (opcional)
          <select name="roadmap_snapshot_id">
            <option value="">Sin roadmap</option>
            {% for roadmap in roadmaps %}
              <option value="{{ roadmap.pk }}">{{ roadmap.title|default:"Roadmap" }} · versión {{ roadmap.version }}</option>
            {% endfor %}
          </select>
        </label>
        <p>El roadmap y el paquete quedan fijados a la sesión; una corrección posterior no cambia este recorrido.</p>
        <button class="button-primary" type="submit">Preparar distribución</button>
      </form>
    </main>
  </body>
</html>
