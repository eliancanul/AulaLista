<style>
:root{--wine:#561b32;--ink:#282e2c;--muted:#68706b;--line:#dedfd8;--paper:#fff;--bg:#f5f4ef;--green:#25634e;--mint:#eaf4ed;--amber:#92601c;--sand:#fbf3e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:9px 16px;font-weight:600}button:hover{border-color:var(--wine);background:#faf4f6}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #357fa8;outline-offset:3px}button.primary{background:var(--wine);border-color:var(--wine);color:white}button.quiet{background:transparent;border-color:transparent;color:var(--wine)}button:disabled{opacity:.45;cursor:default}.brand{background:var(--wine);color:white;padding:17px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between}.logo{font:bold 28px Georgia,serif}.logo span{border:1px solid #c3ab9a;padding:2px 9px;margin-right:12px;font-size:24px}.demo{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.nav{display:flex;gap:26px;background:white;border-bottom:1px solid var(--line);padding:14px max(24px,calc((100vw - 1200px)/2));font-size:14px;overflow:auto;white-space:nowrap}.nav strong{color:var(--wine)}main{max-width:1200px;margin:36px auto 0;padding:0 24px 150px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font:400 clamp(30px,4vw,42px)/1.2 Georgia,serif;margin:8px 0 12px}h2{font-size:23px;line-height:1.3;margin:0 0 12px}h3{font-size:18px;margin:0 0 8px}p{margin:0 0 16px}.muted{color:var(--muted)}.lead{max-width:720px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:24px}.pill{display:inline-flex;border-radius:30px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--mint);color:var(--green)}.pill.amber{background:var(--sand);color:var(--amber)}.topline{margin:22px 0}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button.selected{background:var(--wine);color:white;border-color:var(--wine)}.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:24px}.stack{display:grid;gap:18px}.line{padding:18px 0;border-top:1px solid var(--line)}.line:first-child{border-top:0}.step{display:grid;grid-template-columns:36px 1fr;gap:12px}.num{color:var(--wine);font:24px Georgia,serif}.attention{background:var(--sand);border-left:3px solid #b48137;padding:18px;border-radius:0 9px 9px 0;margin:16px 0}.attention p{margin-bottom:12px}.label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}textarea,input{width:100%;border:1px solid #9da49d;border-radius:7px;padding:12px;background:white;color:var(--ink)}textarea{min-height:125px;resize:vertical}.source{background:#f9f7f0;border:1px solid #e4decd;border-radius:10px;padding:23px}.source blockquote{margin:16px 0;padding-left:15px;border-left:3px solid #c1b38d;font:19px/1.65 Georgia,serif}.source small{color:var(--muted)}summary{cursor:pointer;min-height:44px;padding:10px 0;font-weight:600}details .line{padding:12px 0}.approve{margin-top:25px;padding:20px 0;border-top:1px solid var(--line)}.rail{border-right:1px solid var(--line);padding-right:22px}.rail button{display:block;text-align:left;width:100%;margin:7px 0;background:transparent;border-color:transparent}.rail button.selected{background:white;border-color:var(--line);color:var(--wine)}.desk{display:grid;grid-template-columns:205px minmax(0,1fr);gap:25px}.desk .two{grid-template-columns:1.05fr 1fr}.wizard{max-width:1000px;margin:auto}.progress{height:5px;background:#e4e7e0;border-radius:5px;margin:14px 0 28px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.question{font-size:28px;line-height:1.3}.bigcheck{font-size:40px;color:var(--green)}.switch{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#202925;color:white;padding:8px;border-radius:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 35px #0003;z-index:8;max-width:calc(100vw - 24px)}.switch button{background:transparent;color:white;border-color:#526059;padding:5px 13px;flex-shrink:0}.switch .name{text-align:center;min-width:190px;font-size:14px}.switch small{display:block;color:#b8c8be;font-size:10px;letter-spacing:.12em}.state{margin-top:24px;color:var(--muted);font-size:12px}.state summary{font-size:12px;font-weight:400}#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#205d47;color:white;padding:12px 22px;border-radius:10px;z-index:30;box-shadow:0 6px 20px #0002}dialog{max-width:680px;width:calc(100% - 32px);border:0;border-radius:16px;padding:28px;box-shadow:0 20px 90px #0004}dialog::backdrop{background:#1d292970}.footer-note{font-size:13px;color:var(--muted);margin-top:12px}.page-sheet{border-top:5px solid #c7b895}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini{font-size:13px}.side-note{padding:0 3px}.side-note h3{font-size:16px}.side-note p{font-size:14px}.readtext{white-space:pre-line}.success{background:var(--mint);padding:24px;border-radius:12px} @media(max-width:850px){.desk{grid-template-columns:1fr}.rail{display:flex;gap:7px;overflow:auto;border-right:0;padding:0}.rail button{min-width:150px}.two,.desk .two{grid-template-columns:1fr}.brand{padding:14px 20px}.nav{padding:13px 20px;gap:18px}main{margin-top:24px;padding:0 20px 150px}.card{padding:20px}.demo{max-width:140px;text-align:right;font-size:10px}.question{font-size:24px}}@media(max-width:450px){.switch .name{min-width:145px}.switch{gap:4px}.switch button{padding:5px 10px}.fieldgrid{grid-template-columns:1fr}}
.volume-bar{margin:0 auto 28px;max-width:1000px;padding-bottom:18px;border-bottom:1px dashed var(--line)}.big-summary{display:flex;align-items:center;justify-content:space-between;gap:20px;background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}.auto-entry{text-align:left;background:var(--mint);border:0;color:var(--green)}.auto-entry span{display:block;font-size:13px;font-weight:400}.answer-scroll{background:var(--bg);padding:18px;border-radius:8px;max-height:none}.large-question{align-items:start}.large-question .source blockquote{font-size:18px}.index-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:8px 0;text-align:left}select{font:inherit;max-width:100%;width:100%;padding:12px;border:1px solid var(--line);background:white;border-radius:8px}.switch{bottom:10px}.large-question{padding-bottom:15px}@media(max-width:650px){.big-summary{align-items:stretch;flex-direction:column;gap:12px}.volume-bar .row{gap:6px}.index-item{align-items:start;flex-direction:column}} </style>
<header class="brand"><div class="logo"><span>A</span>AulaLista</div><div class="demo">Prototipo interactivo<br>Datos de demostración</div></header><nav class="nav"><span>Sesiones</span><span>Avance curricular</span><strong>Currícula y autoría</strong><span>Salones</span><span>Resultados</span></nav><main id="app"></main><div class="switch"><button onclick="cycle(-1)" aria-label="Variante anterior">←</button><div class="name" id="variant-label"></div><button onclick="cycle(1)" aria-label="Variante siguiente">→</button><button onclick="reset()" aria-label="Reiniciar demostración" title="Reiniciar demostración">↺</button></div><dialog id="modal"></dialog><div id="toast" role="status" hidden></div>
<script>
const names={A:'Cuaderno de clase',B:'Revisión guiada',C:'Mesa de revisión'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
const original=[{label:'Lugar de la actividad',day:0,q:'¿Qué parte se realiza en casa?',value:'Solo la tarea de los anexos 1 y 2.',source:'Asignar como tarea para la casa el anexo 1 y 2 del cuadernillo de actividades.',page:2,why:'El documento menciona aula y casa. Aclara cómo lo presentarás en esta clase.'},{label:'Anexos de la tarea',day:0,q:'¿Qué anexos acompañan esta tarea?',value:'Anexos 1 y 2',source:'Cuadernillo de actividades: anexos 1 y 2.',page:2,why:'Comprueba la referencia antes de compartir los materiales.'},{label:'Materiales del martes',day:1,q:'¿Con qué materiales trabajará el grupo?',value:'Tarjetas de letras y cuaderno.',source:'Ejemplo simulado: tarjetas de letras y cuaderno de clase.',page:2,why:'Este caso de demostración permite probar una corrección.'}];
let state;function initial(){return {day:0,current:0,section:'clase',resolved:[],deferred:[],values:original.map(x=>x.value),grade:'1.º de primaria',approved:false}}state=initial();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const left=()=>original.length-state.resolved.length;const pending=()=>original.map((_,i)=>i).filter(i=>!state.resolved.includes(i));
function notice(s){document.getElementById('toast').textContent=s;document.getElementById('toast').hidden=false;setTimeout(()=>document.getElementById('toast').hidden=true,2800)}
function cycle(n){let keys=Object.keys(names);variant=keys[(keys.indexOf(variant)+n+3)%3];let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState({},'',u);render()}
function reset(){state=initial();render();notice('Demostración reiniciada')}
function day(n){state.day=n;render()}function pick(i){state.current=i;state.day=original[i].day;state.section='duda';render()}function section(s){state.section=s;render()}
function resolve(i){state.resolved=[...new Set([...state.resolved,i])];state.deferred=state.deferred.filter(x=>x!==i);state.approved=false;let p=pending();state.current=p.find(x=>x>i)??p[0]??i;render();notice('Respuesta guardada · puedes volver a corregirla')}
function defer(i){state.deferred=[...new Set([...state.deferred,i])];let p=pending().filter(x=>x!==i);state.current=p[0]??i;render();notice('Queda pendiente para después')}
function edit(i){const d=document.getElementById('modal');d.innerHTML=`<div class="row spread"><h2>Corregir ${esc(original[i].label.toLowerCase())}</h2><button onclick="closeModal()" aria-label="Cerrar">×</button></div><label class="label" for="editvalue">Contenido de tu planeación</label><textarea id="editvalue">${esc(state.values[i])}</textarea><div class="row" style="margin-top:18px"><button class="primary" onclick="save(${i})">Guardar y resolver duda</button><button onclick="closeModal()">Cancelar</button></div><p class="footer-note">Se guarda solo en esta demostración. Puedes modificarlo otra vez.</p>`;d.showModal();document.getElementById('editvalue').focus()}
function closeModal(){document.getElementById('modal').close()}function save(i){state.values[i]=document.getElementById('editvalue').value;closeModal();resolve(i)}
function source(i){let d=document.getElementById('modal');d.innerHTML=`<div class="row spread"><h2>Referencia del documento</h2><button onclick="closeModal()" aria-label="Cerrar">×</button></div>${sourceBox(i)}`;d.showModal()}
function sourceBox(i){let x=original[i];return `<div class="source page-sheet"><div class="eyebrow">Referencia · página ${x.page}</div><blockquote>${esc(x.source)}</blockquote><small>Fragmento de referencia para el prototipo. No es un visor ni una comprobación automática del PDF.</small></div>`}
function autos(){return `<details class="card"><summary>✓ Datos comprobados con tu PDF <span class="muted mini">· 6 ejemplos</span></summary><p class="muted mini">Estado simulado para comparar los diseños. Siempre puedes corregir estos datos.</p><div class="line row spread"><span>Proyecto<br><strong>El uso de las vocales y la letra M</strong></span><span class="mini muted">Pág. 1</span></div><div class="line row spread"><span>Grado<br><strong>${esc(state.grade)}</strong></span><button class="quiet" onclick="editGrade()">Editar</button></div><div class="fieldgrid line"><div><span class="label">Campo formativo</span>Lenguajes</div><div><span class="label">Metodología</span>Aprendizaje basado en Problemas</div><div><span class="label">Sesión 1</span>Lunes · Identificación</div><div><span class="label">Sesión 2</span>Martes · Recuperación</div></div></details>`}
function editGrade(){let d=document.getElementById('modal');d.innerHTML=`<h2>Corregir grado</h2><label class="label" for="grade">Grado escolar</label><input id="grade" value="${esc(state.grade)}"><div class="row" style="margin-top:18px"><button class="primary" onclick="saveGrade()">Guardar</button><button onclick="closeModal()">Cancelar</button></div>`;d.showModal()}
function saveGrade(){state.grade=document.getElementById('grade').value;state.approved=false;closeModal();render();notice('Grado corregido en la demostración')}
function approval(){return `<div class="approve row spread"><div><strong>${state.approved?'Planeación aprobada en la demostración':left()?'Primero aclara las dudas pendientes':'Todo listo para tu revisión final'}</strong><div class="muted mini">${left()?left()+' dudas por resolver. Puedes continuar después.':'Lee ambas clases antes de dar tu aprobación.'}</div></div><button class="primary" onclick="approve()" ${left()||state.approved?'disabled':''}>${state.approved?'✓ Aprobada':'Revisar y aprobar'}</button></div>`}
function approve(){let d=document.getElementById('modal');d.innerHTML=`<h2>Tu planeación está lista</h2><p><strong>El uso de las vocales y la letra M</strong><br>${esc(state.grade)} · 2 clases</p>${original.map((x,i)=>`<div class="line"><strong>${x.label}</strong><p>${esc(state.values[i])}</p></div>`).join('')}<p class="footer-note">Aprobación simulada. No publica ni activa ninguna sesión.</p><div class="row"><button class="primary" onclick="state.approved=true;closeModal();render();notice('Aprobación simulada completada')">Aprobar planeación</button><button onclick="closeModal()">Seguir revisando</button></div>`;d.showModal()}
function head(sub){return `<div class="eyebrow">Tu planeación · ${esc(state.grade)}</div><h1>El uso de las vocales y la letra M</h1><p class="muted lead">${sub}</p>`}
function stats(){return `<div class="row spread topline"><span class="pill ${left()?'amber':''}">${left()?left()+(left()===1?' duda para ti':' dudas para ti'):'✓ Dudas resueltas'}</span><span class="muted mini">2 clases · ${state.resolved.length} de 3 dudas resueltas</span></div>`}
function tabs(){return `<div class="tabs"><button class="${state.day===0?'selected':''}" onclick="day(0)">Lunes <span class="mini">· Identificación</span></button><button class="${state.day===1?'selected':''}" onclick="day(1)">Martes <span class="mini">· Recuperación</span></button></div>`}
function doubt(i){let done=state.resolved.includes(i);return `<div class="${done?'line':'attention'}"><div class="row spread"><strong>${done?'✓ '+original[i].label:original[i].q}</strong>${state.deferred.includes(i)?'<span class="mini">Para después</span>':''}</div><p>${esc(state.values[i])}</p><div class="row">${done?'':`<button class="primary" onclick="resolve(${i})">Está bien</button>`}<button onclick="edit(${i})">Corregir</button><button class="quiet" onclick="source(${i})">Ver fuente</button></div></div>`}
function lesson(){return `<div class="card"><div class="row spread"><h2>${state.day===0?'Lunes · Identificación':'Martes · Recuperación'}</h2><span class="muted mini">Lenguajes</span></div><p class="muted">${state.day===0?'Reconocer las vocales mediante juegos e imágenes.':'Practicar letras y formar palabras sencillas.'}</p><div class="step line"><span class="num">01</span><div><h3>Inicio</h3><p>${state.day===0?'Juega a reconocer vocales con tarjetas. Pide al grupo que nombre la vocal de cada imagen.':'Recupera lo trabajado el lunes con un juego de letras.'}</p></div></div><div class="step line"><span class="num">02</span><div><h3>Desarrollo</h3><p>${state.day===0?'Cada estudiante dibuja y decora una imagen relacionada con las vocales. Después escribe palabras en su dibujo.':'Forma palabras sencillas con las tarjetas y compártelas con el grupo.'}</p></div></div><div class="step line"><span class="num">03</span><div><h3>Cierre</h3><p>${state.day===0?'Trabajar los anexos 1 y 2 del cuadernillo.':'Compartir las palabras y comentar lo aprendido.'}</p>${original.map((x,i)=>x.day===state.day?doubt(i):'').join('')}</div></div><p class="footer-note">Redacción resumida de demostración; no sustituye la planeación original.</p></div>`}
function VariantA(){return head('Lee tus clases en orden. Solo destacamos lo que necesita una decisión tuya.')+stats()+tabs()+`<div class="two"><div>${lesson()}${approval()}</div><aside class="stack" style="align-content:start">${autos()}<div class="side-note"><h3>Una revisión a tu ritmo</h3><p class="muted">Las dudas están dentro de la clase a la que pertenecen. Puedes consultar la fuente sin perder tu lugar.</p><button class="quiet" onclick="source(0)">Consultar referencia del lunes ↗</button></div></aside></div>`}
function question(i){let done=state.resolved.includes(i);return `<div class="card"><div class="eyebrow">${original[i].day===0?'Lunes':'Martes'} · ${original[i].label}</div><h2 class="question" style="margin-top:15px">${original[i].q}</h2><p class="muted">${original[i].why}</p><div class="attention"><span class="label">En tu planeación organizada</span>${esc(state.values[i])}</div><div class="row"><button class="primary" onclick="resolve(${i})">${done?'Mantener respuesta':'Está bien, continuar'}</button><button onclick="edit(${i})">Corregir</button></div><button class="quiet" style="margin-top:12px" onclick="defer(${i})">Revisar después →</button></div>`}
function VariantB(){let i=state.current;return `<div class="wizard">${head('Aclaremos lo necesario, una pregunta a la vez. Al terminar podrás leer la planeación completa.')}${stats()}<div class="progress"><span style="width:${state.resolved.length/3*100}%"></span></div>${left()?`<div class="two">${question(i)}${sourceBox(i)}</div>`:`<div class="success"><div class="bigcheck">✓</div><h2>Ya aclaraste las tres dudas</h2><p>Ahora lee tus clases y revisa cualquier respuesta antes de aprobar.</p></div>${tabs()}${lesson()}${approval()}`}<details style="margin:24px 0"><summary>Tus respuestas · volver y corregir</summary>${original.map((x,i)=>`<div class="line row spread"><div>${state.resolved.includes(i)?'✓':'○'} ${x.label}<div class="muted mini">${esc(state.values[i])}</div></div><button onclick="edit(${i})">Editar</button></div>`).join('')}</details>${autos()}</div>`}
function VariantC(){return head('Tu planeación y su referencia, en el mismo espacio.')+`<div class="desk"><aside class="rail"><div class="eyebrow">Planeación</div><button class="${state.section==='resumen'?'selected':''}" onclick="section('resumen')">Resumen del proyecto</button><button class="${state.section==='clase'&&state.day===0?'selected':''}" onclick="state.day=0;section('clase')">Lunes · Identificación</button><button class="${state.section==='clase'&&state.day===1?'selected':''}" onclick="state.day=1;section('clase')">Martes · Recuperación</button><div class="eyebrow" style="margin-top:20px">${left()} dudas pendientes</div>${original.map((x,i)=>`<button class="${state.section==='duda'&&state.current===i?'selected':''}" onclick="pick(${i})">${state.resolved.includes(i)?'✓':'○'} ${x.label}</button>`).join('')}</aside><div>${stats()}${state.section==='resumen'?autos():state.section==='duda'?`<div class="two">${question(state.current)}${sourceBox(state.current)}</div>`:`<div class="two">${lesson()}<aside>${sourceBox(state.day===0?0:2)}<p class="footer-note">Referencia disponible mientras lees y corriges.</p></aside></div>`}${approval()}</div></div>`}
function render(){document.getElementById('variant-label').innerHTML=`<small>PROTOTIPO ${variant} / 3</small>${names[variant]}`;document.getElementById('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[variant])()+`<details class="state"><summary>Estado de la demostración · solo en memoria</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify({variant,...state},null,2))}</pre></details>`}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||document.getElementById('modal').open)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();

// Larger B scenario: synthetic 40-page plan, 20 classes, 68 checked fields and 12 doubts.
const compactB = VariantB;
let volume = new URLSearchParams(location.search).get('volume') || 'small';
const weeks=['Semana 1 · Reconocer sonidos','Semana 2 · Formar palabras','Semana 3 · Leer y escribir','Semana 4 · Compartir lo aprendido'];
const days=['Lunes','Martes','Miércoles','Jueves','Viernes'];
const topics=['Escuchamos las vocales','Buscamos la letra M','Relacionamos imagen y palabra','Construimos palabras','Compartimos nuestros dibujos'];
const bigLessons=Array.from({length:20},(_,i)=>({week:Math.floor(i/5),day:days[i%5],title:topics[i%5],page:i*2+1}));
const examples=[
 {label:'Trabajo en casa',q:'¿Qué actividades se realizarán en casa?',value:'El juego con tarjetas se realiza en el aula. Los anexos se resuelven en casa con apoyo de una persona adulta.',source:'Realice un juego de repaso de las vocales utilizando tarjetas o fichas. Pida a los estudiantes que nombren la vocal correspondiente a cada imagen.\n\nAsigne como tarea para casa los anexos del cuadernillo. Al día siguiente, invite al grupo a compartir sus respuestas.',why:'La sesión combina trabajo en clase y una tarea. Comprueba que la separación sea correcta.'},
 {label:'Instrucciones de la actividad',q:'¿Estas instrucciones conservan lo que quieres trabajar?',value:'Organiza equipos pequeños y entrega tarjetas con vocales y consonantes.\n\nCada equipo observa las imágenes, nombra los objetos y comenta con qué sonido comienza cada palabra. Pide que busquen la letra correspondiente y expliquen su elección.\n\nDespués, cada estudiante dibuja un objeto en el cuaderno y escribe una palabra con las letras trabajadas. Acompaña a quienes necesiten apoyo para reconocer los sonidos.\n\nPara cerrar, invita a compartir los dibujos y las distintas palabras que encontraron. Retoma los ejemplos que ayuden a distinguir sonidos semejantes.',source:'En equipos, observen las imágenes y nombren los objetos. Relacionen los sonidos con las grafías trabajadas.\n\nDibujen un objeto y escriban su nombre. Brinde apoyo a quienes lo requieran. Compartan los trabajos y recuperen las distintas respuestas del grupo.',why:'Este texto se reorganizó para facilitar la lectura. Revisa que no añada ni cambie una intención de tu planeación.'},
 {label:'Materiales por confirmar',q:'¿Qué material necesitas para esta clase?',value:'Tarjetas de letras, cuaderno y láminas del cuadernillo.',source:'Prepare tarjetas de letras y cuadernos. Utilice las láminas indicadas en el cuadernillo de actividades.',why:'La referencia a las láminas es general. Puedes precisar el material o dejar la duda para después.'}
];
const bigDoubts=Array.from({length:12},(_,i)=>({...examples[i%3],lesson:Math.floor(i/3)*5+[0,2,4][i%3],week:Math.floor(i/3)}));
const bigAuto=Array.from({length:68},(_,i)=>({lesson:i%20,label:['Nombre de la sesión','Campo formativo','Grado escolar','Día de trabajo'][Math.floor(i/20)],value:[bigLessons[i%20].title,'Lenguajes','1.º de primaria',bigLessons[i%20].day][Math.floor(i/20)]}));
let big={current:0,resolved:[],deferred:[],values:bigDoubts.map(x=>x.value),approved:false};
function volumeBar(){return `<div class="row spread volume-bar"><span class="mini muted">Tamaño del ejemplo</span><div class="row"><button class="${volume==='small'?'primary':''}" onclick="setVolume('small')">2 clases</button><button class="${volume==='large'?'primary':''}" onclick="setVolume('large')">20 clases · textos largos</button></div></div>`}
function setVolume(v){volume=v;const u=new URL(location);u.searchParams.set('volume',v);history.replaceState({},'',u);render()}
function bigPending(){return bigDoubts.map((_,i)=>i).filter(i=>!big.resolved.includes(i))}
function bigPick(i){big.inspect=true;big.current=Number(i);closeModal();render()}
function bigNext(i){let all=bigPending();return all.find(x=>x>i&&!big.deferred.includes(x))??all.find(x=>!big.deferred.includes(x))??all.find(x=>x!==i)??i}
function bigResolve(){big.inspect=false;const i=big.current;big.resolved=[...new Set([...big.resolved,i])];big.deferred=big.deferred.filter(x=>x!==i);big.approved=false;big.current=bigNext(i);render();notice('Respuesta guardada. Puedes volver a corregirla.')}
function bigDefer(){const i=big.current;big.deferred=[...new Set([...big.deferred,i])];big.current=bigNext(i);render();notice('Pendiente para después; no cuenta como resuelta.')}
function bigEdit(){const d=document.getElementById('modal');d.innerHTML=`<div class="row spread"><h2>Corregir respuesta</h2><button onclick="closeModal()" aria-label="Cerrar">×</button></div><label for="bigedit" class="label">${esc(bigDoubts[big.current].label)}</label><textarea id="bigedit" style="min-height:280px">${esc(big.values[big.current])}</textarea><div class="row" style="margin-top:18px"><button class="primary" onclick="bigSave()">Guardar y resolver duda</button><button onclick="closeModal()">Cancelar</button></div>`;d.showModal()}
function bigSave(){big.values[big.current]=document.getElementById('bigedit').value;closeModal();bigResolve()}
function bigIndex(){let d=document.getElementById('modal');d.innerHTML=`<div class="row spread"><h2>Tus dudas y respuestas</h2><button onclick="closeModal()" aria-label="Cerrar">×</button></div><p class="muted">Ve directamente a una duda o vuelve a una respuesta anterior.</p>${weeks.map((w,k)=>`<div class="line"><h3>${w}</h3>${bigDoubts.map((x,i)=>x.week===k?`<button class="index-item" onclick="bigPick(${i})"><span>${bigLessons[x.lesson].day} · ${x.label}</span><span class="pill ${big.resolved.includes(i)?'':'amber'}">${big.resolved.includes(i)?'Resuelta':big.deferred.includes(i)?'Para después':'Pendiente'}</span></button>`:'').join('')}</div>`).join('')}`;d.showModal()}
function bigSource(x){return `<aside class="source page-sheet"><div class="row spread"><span class="eyebrow">Referencia · pág. ${bigLessons[x.lesson].page}</span><span class="mini muted">PDF de ejemplo</span></div><blockquote class="readtext">${esc(x.source.replaceAll('\n','\n'))}</blockquote><small>Contenido sintético para explorar una planeación extensa. No es evidencia de tu PDF real.</small></aside>`}
function bigAutoModal(){let d=document.getElementById('modal');d.innerHTML=`<div class="row spread"><h2>Datos comprobados</h2><button onclick="closeModal()" aria-label="Cerrar">×</button></div><p class="muted">68 datos simulados, organizados por clase. No requieren 68 confirmaciones.</p><label class="label" for="auto-class">Clase que quieres consultar</label><select id="auto-class" onchange="bigAutoRows(this.value)">${bigLessons.map((l,i)=>`<option value="${i}">Semana ${l.week+1} · ${l.day} · ${l.title}</option>`).join('')}</select><div id="auto-rows"></div>`;d.showModal();bigAutoRows(0)}
function bigAutoRows(n){document.getElementById('auto-rows').innerHTML=bigAuto.map((a,i)=>a.lesson===Number(n)?`<div class="line row spread"><div><span class="label">${a.label}</span><strong>${esc(a.value)}</strong><div class="muted mini">Página ${bigLessons[a.lesson].page} · comprobación simulada</div></div><button onclick="bigAutoEdit(${i})">Editar</button></div>`:'').join('')}
function bigAutoEdit(i){let d=document.getElementById('modal');d.innerHTML=`<h2>Editar ${bigAuto[i].label.toLowerCase()}</h2><label class="label" for="auto-value">Valor de demostración</label><input id="auto-value" value="${esc(bigAuto[i].value)}"><div class="row" style="margin-top:18px"><button class="primary" onclick="bigAutoSave(${i})">Guardar</button><button onclick="bigAutoModal()">Cancelar</button></div>`}
function bigAutoSave(i){bigAuto[i].value=document.getElementById('auto-value').value;big.approved=false;bigAutoModal();document.getElementById('auto-class').value=bigAuto[i].lesson;bigAutoRows(bigAuto[i].lesson);notice('Dato corregido en el ejemplo')}
function bigOverview(){let d=document.getElementById('modal');d.innerHTML=`<div class="row spread"><h2>Las 20 clases de tu planeación</h2><button onclick="closeModal()" aria-label="Cerrar">×</button></div><p class="muted">Vista resumida de demostración. La revisión de dudas no sustituye la lectura de tus clases.</p>${weeks.map((w,k)=>`<details class="line"><summary>${w} · 5 clases</summary>${bigLessons.map((l,i)=>l.week===k?`<div class="line"><h3>${l.day} · ${l.title}</h3><p><strong>Inicio:</strong> Recuperar los sonidos y palabras trabajados.</p><p><strong>Desarrollo:</strong> Practicar con imágenes, tarjetas y escritura en el cuaderno.</p><p><strong>Cierre:</strong> Compartir los trabajos del grupo.</p>${bigDoubts.map((x,j)=>x.lesson===i?`<div class="attention"><strong>${x.label}</strong><p class="readtext">${esc(big.values[j])}</p><button onclick="bigPick(${j})">${big.resolved.includes(j)?'Revisar respuesta':'Resolver duda'}</button></div>`:'').join('')}</div>`:'').join('')}</details>`).join('')}`;d.showModal()}
function bigApprove(){const d=document.getElementById('modal');d.innerHTML=`<h2>Aprobar el ejemplo</h2><p>20 clases · 12 dudas resueltas · 68 datos de comprobación simulada.</p><p>Esta acción solo cambia el estado del prototipo.</p><div class="row"><button class="primary" onclick="big.approved=true;closeModal();render()">Aprobar ejemplo</button><button onclick="closeModal()">Volver</button></div>`;d.showModal()}
VariantB=function(){if(volume==='small')return volumeBar()+compactB();let i=big.current,x=bigDoubts[i],l=bigLessons[x.lesson],remaining=bigPending().length,wDone=big.resolved.filter(j=>bigDoubts[j].week===x.week).length;return `${volumeBar()}<div class="wizard"><div class="eyebrow">Planeación de cuatro semanas · ejemplo simulado</div><h1>Vocales, letras y primeras palabras</h1><div class="row spread"><p class="muted">20 clases · 40 páginas · 1.º de primaria</p><button class="quiet" onclick="bigOverview()">Ver todas las clases →</button></div><div class="big-summary"><button class="auto-entry" onclick="bigAutoModal()"><strong>✓ 68 datos comprobados</strong><span>Consultar o corregir →</span></button><div><strong>${remaining?remaining+' dudas pendientes':'✓ Dudas resueltas'}</strong><div class="mini muted">${big.resolved.length} de 12 resueltas${big.deferred.length?' · '+big.deferred.length+' para después':''}</div></div><button onclick="bigIndex()">Dudas y respuestas</button></div><div class="progress"><span style="width:${big.resolved.length/12*100}%"></span></div>${remaining||big.inspect?`<div class="row spread" style="margin-bottom:18px"><div><div class="eyebrow">${weeks[x.week]}</div><span class="muted mini">${wDone} de 3 dudas resueltas en esta semana</span></div><span class="mini muted">${l.day} · Clase ${x.lesson+1} de 20</span></div><div class="two large-question"><section class="card"><span class="pill ${big.resolved.includes(i)?'':'amber'}">${big.resolved.includes(i)?'Respuesta guardada':big.deferred.includes(i)?'Para después':'Necesita tu atención'}</span><h2 class="question" style="margin-top:18px">${x.q}</h2><p class="muted">${x.why}</p><div class="answer-scroll"><span class="label">En tu planeación organizada</span><div class="readtext">${esc(big.values[i])}</div></div><div class="row" style="margin-top:20px"><button class="primary" onclick="bigResolve()">Está bien, continuar</button><button onclick="bigEdit()">Corregir</button><button class="quiet" onclick="bigDefer()">Revisar después</button></div></section>${bigSource(x)}</div>`:`<div class="success"><h2>${big.approved?'Ejemplo aprobado':'Ya aclaraste las 12 dudas'}</h2><p>Puedes leer las 20 clases y volver a cualquier respuesta antes de aprobar.</p><div class="row"><button onclick="bigOverview()">Leer mi planeación</button><button onclick="bigIndex()">Revisar mis respuestas</button><button class="primary" ${big.approved?'disabled':''} onclick="bigApprove()">Aprobar ejemplo</button></div></div>`}<p class="footer-note">Puedes cambiar de semana desde «Dudas y respuestas». Los cambios solo duran mientras esta pestaña permanezca sin recargar.</p><details class="state"><summary>Estado del ejemplo extenso</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(big,null,2))}</pre></details></div>`};
const oldReset=reset;reset=function(){big={current:0,resolved:[],deferred:[],values:bigDoubts.map(x=>x.value),approved:false};oldReset()};
render();

</script></html>
