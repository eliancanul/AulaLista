<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AulaLista · Opciones de Roadmap docente</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202735;
        --muted: #657083;
        --paper: #f7f9fc;
        --panel: #ffffff;
        --line: #dbe2ec;
        --blue: #3566f0;
        --blue-dark: #2448b8;
        --green: #16845b;
        --yellow: #f2b84b;
        --shadow: 0 18px 50px rgb(35 51 80 / 10%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); }
      button { font: inherit; }
      a { color: inherit; }
      .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 24px 0; }
      .brand { font-weight: 850; letter-spacing: -.04em; font-size: 1.15rem; }
      .brand span { color: var(--blue); }
      .topbar nav { display: flex; gap: 8px; }
      .nav-link { border: 0; background: transparent; color: var(--muted); padding: 9px 12px; border-radius: 10px; }
      .nav-link.active { color: var(--ink); background: #e9efff; font-weight: 750; }
      .eyebrow { color: var(--blue); letter-spacing: .13em; font-size: .73rem; font-weight: 850; margin: 0 0 10px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1; letter-spacing: -.06em; margin-bottom: 14px; }
      h2 { letter-spacing: -.035em; }
      .lede { max-width: 680px; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
      .page-intro { padding: 42px 0 24px; }
      .variant-tag { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; font-size: .82rem; background: var(--panel); }
      .variant-tag b { color: var(--ink); }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 18px 0; }
      .toolbar p { color: var(--muted); margin: 0; font-size: .9rem; }
      .button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 11px 15px; font-weight: 750; cursor: pointer; }
      .button:hover, .button:focus-visible { border-color: var(--blue); outline: 3px solid #dfe7ff; }
      .button.primary { background: var(--blue); color: white; border-color: var(--blue); }
      .button.primary:hover, .button.primary:focus-visible { background: var(--blue-dark); }
      .status { min-height: 24px; color: var(--green); font-size: .9rem; font-weight: 700; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); }
      .progress-strip { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 20px 24px; }
      .progress-copy strong { display: block; margin-bottom: 5px; }
      .progress-copy small { color: var(--muted); }
      .progress-bar { height: 9px; background: #e9edf4; border-radius: 999px; overflow: hidden; margin-top: 12px; }
      .progress-bar i { display: block; height: 100%; width: 42%; background: linear-gradient(90deg, #3566f0, #7d9aff); border-radius: inherit; }
      .progress-number { color: var(--blue); font-weight: 850; font-size: 1.4rem; }

      /* A — vertical path, game-like */
      .variant-a { --a-purple: #6a48e8; --a-lilac: #f0edff; }
      .variant-a .panel { border-radius: 28px; }
      .a-hero { background: linear-gradient(135deg, #202a55, #4c5fc4); color: white; padding: 28px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; }
      .a-hero .eyebrow, .a-hero .lede { color: #dfe5ff; }
      .a-hero h2 { font-size: 2rem; margin-bottom: 8px; }
      .streak { text-align: center; padding: 12px 16px; border-radius: 18px; background: rgb(255 255 255 / 14%); }
      .streak strong { display: block; color: #ffd675; font-size: 2rem; }
      .a-path { position: relative; display: grid; gap: 10px; padding: 30px 20px 34px; }
      .a-path::before { content: ""; position: absolute; top: 42px; bottom: 42px; left: 62px; width: 4px; background: #e1ddfa; border-radius: 4px; }
      .a-unit { position: relative; z-index: 1; display: grid; grid-template-columns: 82px 1fr; align-items: center; gap: 18px; }
      .a-node { width: 62px; height: 62px; display: grid; place-items: center; border: 5px solid white; border-radius: 50%; background: #d7dbe7; color: #647086; box-shadow: 0 3px 0 #b9c0cf; font-weight: 900; }
      .a-unit.done .a-node { background: #47b985; color: white; box-shadow: 0 3px 0 #18835a; }
      .a-unit.current .a-node { background: var(--a-purple); color: white; box-shadow: 0 3px 0 #4d31b5; transform: scale(1.08); }
      .a-card { border: 1px solid var(--line); background: white; border-radius: 18px; padding: 16px 18px; }
      .a-card h3 { margin-bottom: 5px; font-size: 1.05rem; }
      .a-card p { margin: 0; color: var(--muted); font-size: .88rem; }
      .a-card .button { margin-top: 12px; }
      .a-card.current-card { border-color: #bfb3ff; box-shadow: 0 8px 20px rgb(106 72 232 / 12%); }

      /* B — compact lesson route */
      .variant-b { --b-ink: #182238; --b-mint: #d5f1e4; --b-orange: #ff976d; background: #fcfbf7; }
      .variant-b .topbar { border-bottom: 1px solid #e8e3d7; }
      .variant-b .brand span { color: var(--b-orange); }
      .variant-b .nav-link.active { background: var(--b-mint); }
      .b-layout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
      .b-sidebar { position: sticky; top: 18px; padding: 20px; background: #f1eee5; border-radius: 20px; }
      .b-sidebar h2 { font-size: 1rem; margin-bottom: 16px; }
      .b-sidebar ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; }
      .b-sidebar li { padding: 10px 12px; color: #73776f; border-radius: 10px; font-size: .9rem; }
      .b-sidebar li.current { background: white; color: var(--b-ink); font-weight: 800; box-shadow: 0 3px 12px rgb(39 45 36 / 8%); }
      .b-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 18px; }
      .b-heading h2 { font-size: 2rem; margin-bottom: 4px; }
      .b-heading p { margin: 0; color: #777d76; }
      .b-route { overflow: hidden; border: 1px solid #e7e2d7; border-radius: 22px; background: white; }
      .b-unit { border-bottom: 1px solid #ebe7de; }
      .b-unit:last-child { border-bottom: 0; }
      .b-unit summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 19px 22px; }
      .b-unit summary::-webkit-details-marker { display: none; }
      .b-unit summary:hover { background: #fffaf3; }
      .b-unit-title { display: flex; align-items: center; gap: 12px; }
      .b-unit-number { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--b-mint); color: #24714f; font-weight: 850; }
      .b-unit small { color: #838880; }
      .b-lessons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 22px 22px 64px; }
      .b-lesson { min-height: 126px; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; border: 1px solid #e7e2d7; border-radius: 15px; background: #fffdfa; }
      .b-lesson.current { border: 2px solid var(--b-orange); padding: 14px; }
      .b-lesson.done { background: #f1fbf6; }
      .b-lesson h3 { font-size: .95rem; margin-bottom: 5px; }
      .b-lesson p { color: #777d76; font-size: .78rem; line-height: 1.4; margin: 0; }
      .b-lesson .button { align-self: start; border-radius: 999px; padding: 7px 10px; font-size: .76rem; }

      /* C — teacher-first hierarchy */
      .variant-c { --c-ink: #1d2938; --c-blue: #2463a8; --c-soft: #eef5fb; background: #f3f5f7; }
      .variant-c .topbar { border-bottom: 1px solid #dfe5eb; }
      .variant-c .brand span { color: var(--c-blue); }
      .variant-c .nav-link.active { background: #e0edf8; color: #174c7c; }
      .c-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
      .c-roadmap { padding: 24px; }
      .c-roadmap-header { display: flex; justify-content: space-between; align-items: start; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
      .c-roadmap-header h2 { margin-bottom: 6px; font-size: 1.75rem; }
      .c-roadmap-header p { color: var(--muted); margin: 0; }
      .c-unit { border-bottom: 1px solid var(--line); }
      .c-unit:last-child { border-bottom: 0; }
      .c-unit summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 18px 0; }
      .c-unit summary::-webkit-details-marker { display: none; }
      .c-chevron { color: var(--c-blue); font-size: 1.2rem; transition: transform .2s; }
      .c-unit[open] .c-chevron { transform: rotate(90deg); }
      .c-unit-number { color: var(--c-blue); font-weight: 900; font-size: .8rem; letter-spacing: .1em; }
      .c-unit h3 { font-size: 1rem; margin: 0 0 3px; }
      .c-unit summary small { color: var(--muted); }
      .c-unit-state { color: var(--green); font-size: .78rem; font-weight: 800; }
      .c-lessons { display: grid; gap: 10px; padding: 0 0 18px 34px; }
      .c-lesson { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 15px 16px; background: #fafcfe; border: 1px solid #dce7f0; border-radius: 14px; }
      .c-lesson.current { background: var(--c-soft); border-color: #99bddc; }
      .c-lesson h4 { margin: 0 0 4px; font-size: .94rem; }
      .c-lesson p { margin: 0; color: var(--muted); font-size: .8rem; }
      .c-completed-at { display: block; margin-top: 5px; color: #8a939e; font-size: .74rem; }
      .c-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; }
      .c-actions .button { padding: 8px 11px; font-size: .8rem; }
      .c-side { display: grid; gap: 14px; }
      .c-side .panel { padding: 20px; border-radius: 18px; box-shadow: none; }
      .c-side h2 { font-size: 1rem; margin-bottom: 10px; }
      .c-side p, .c-side li { color: var(--muted); font-size: .86rem; line-height: 1.5; }
      .c-side ul { margin: 0; padding-left: 18px; }
      .next-action { border-left: 4px solid var(--c-blue); }
      .next-action strong { display: block; margin-bottom: 5px; }
      .variant-c .live-launch, .variant-c .next-action .button.primary { animation: live-launch-pulse 1.8s ease-out both; }
      @keyframes live-launch-pulse { 0% { box-shadow: 0 0 0 0 rgb(36 99 168 / 38%); } 100% { box-shadow: 0 0 0 12px transparent; } }
      .next-session { border-left: 4px solid #8c9aaa; }
      .next-session .eyebrow { color: #6e7b88; }
      .next-session h2 { margin-bottom: 8px; }
      .next-session .button { margin-top: 6px; }
      .variant-c .c-progress-strip .progress-bar, .variant-c .c-progress-strip .progress-number { display: none; }
      .motion-picker { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 16px 0 10px; color: var(--muted); font-size: .78rem; }
      .motion-picker button { border: 1px solid var(--line); border-radius: 999px; background: white; color: var(--muted); padding: 6px 10px; cursor: pointer; font-size: .76rem; }
      .motion-picker button.active, .motion-picker button:hover, .motion-picker button:focus-visible { border-color: var(--c-blue); color: var(--c-blue); background: var(--c-soft); outline: none; }
      .roadmap-continuity { position: relative; display: flex; align-items: center; gap: 12px; overflow: hidden; padding: 12px 0 15px 13px; border-bottom: 1px solid var(--line); }
      .roadmap-continuity::before { content: ""; position: absolute; inset: 8px auto 8px 0; width: 3px; border-radius: 3px; background: #b9c7d4; }
      .continuity-dot { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--c-blue); }
      .continuity-copy { display: grid; gap: 2px; flex: 1; }
      .continuity-copy small { color: var(--muted); font-size: .74rem; }
      .continuity-copy strong { font-size: .86rem; }
      .continuity-caption { margin: 0; color: var(--muted); font-size: .74rem; }
      .motion-soft .continuity-dot { animation: soft-pulse 1.8s ease-out both; }
      .motion-route::after { content: ""; position: absolute; inset: 0 auto 0 -30%; width: 28%; background: linear-gradient(90deg, transparent, rgb(36 99 168 / 18%), transparent); animation: route-sweep 1.1s ease-out both; }
      .motion-slide .continuity-copy, .motion-slide .button { animation: gentle-slide .5s ease-out both; }
      @keyframes soft-pulse { 0% { box-shadow: 0 0 0 0 rgb(36 99 168 / 35%); } 100% { box-shadow: 0 0 0 11px transparent; } }
      @keyframes route-sweep { to { left: 110%; } }
      @keyframes gentle-slide { from { opacity: 0; transform: translateX(-7px); } to { opacity: 1; transform: translateX(0); } }
      @media (prefers-reduced-motion: reduce) {
        .variant-c .live-launch, .variant-c .next-action .button.primary { animation: none; }
      }

      .switcher { position: fixed; z-index: 10; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #25304a; border-radius: 999px; background: #182238; color: white; box-shadow: 0 10px 30px rgb(19 28 50 / 32%); }
      .switcher button { width: 34px; height: 34px; border: 0; border-radius: 50%; color: white; background: #2b395a; cursor: pointer; font-size: 1.1rem; }
      .switcher button:hover, .switcher button:focus-visible { background: var(--blue); outline: 2px solid #aebdff; }
      .switcher-label { min-width: 220px; text-align: center; font-size: .82rem; }
      .switcher-label strong { color: #b9c8ff; }
      .prototype-note { text-align: center; color: var(--muted); font-size: .78rem; padding: 44px 0 100px; }
      .confirm-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 20px; background: rgb(19 31 49 / 42%); }
      .confirm-dialog { width: min(430px, 100%); padding: 26px; border: 1px solid var(--line); border-radius: 20px; background: white; box-shadow: 0 24px 70px rgb(19 31 49 / 25%); }
      .confirm-dialog h2 { margin-bottom: 10px; font-size: 1.35rem; }
      .confirm-dialog p { color: var(--muted); line-height: 1.5; margin-bottom: 20px; }
      .confirm-dialog p strong { color: var(--ink); }
      .confirm-actions { display: flex; justify-content: end; gap: 8px; }

      @media (max-width: 780px) {
        .topbar { align-items: flex-start; flex-direction: column; gap: 12px; }
        .topbar nav { width: 100%; overflow: auto; }
        .a-hero, .c-layout, .b-layout { grid-template-columns: 1fr; }
        .b-sidebar { position: static; }
        .b-lessons { grid-template-columns: 1fr; padding-left: 22px; }
        .c-side { order: -1; }
        .c-lesson { grid-template-columns: 1fr; }
        .c-actions { justify-content: start; }
        .switcher-label { min-width: 150px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const variants = {
        A: { name: "Camino vertical · inspiración Duolingo", className: "variant-a" },
        B: { name: "Ruta compacta · patrón Lingo", className: "variant-b" },
        C: { name: "Roadmap docente · propuesta AulaLista", className: "variant-c" },
      };

      const motionOptions = {
        1: { label: "Resaltado suave", className: "motion-soft", caption: "El último punto respira una vez para orientar sin distraer." },
        2: { label: "Recorrido breve", className: "motion-route", caption: "Una luz recorre la línea y conecta el último punto con la acción." },
        3: { label: "Aparición discreta", className: "motion-slide", caption: "La orientación entra suavemente cuando se prepara la sesión." },
      };

      const data = {
        title: "Fracciones en situaciones cotidianas",
        units: [
          { title: "Reconocer fracciones", detail: "2 de 3 lecciones completas", state: "COMPLETADA", lessons: [
            { title: "Partes de un todo", detail: "Actividad terminada", completedAt: "20 ago 2026", participants: 7, state: "done" },
            { title: "Leer y representar", detail: "Actividad terminada", completedAt: "21 ago 2026", participants: 8, state: "done" },
            { title: "Comprobar lo aprendido", detail: "Actividad terminada", completedAt: "22 ago 2026", participants: 8, state: "done" },
          ] },
          { title: "Comparar fracciones", detail: "Lección actual", state: "ACTUAL", lessons: [
            { title: "Mayor, menor o igual", detail: "Actividad actual · 8 min", state: "current" },
            { title: "Ordenar fracciones", detail: "Disponible después", state: "next" },
            { title: "Reto de la unidad", detail: "Disponible después", state: "next" },
          ] },
          { title: "Usar fracciones", detail: "3 lecciones disponibles", state: "DISPONIBLE", lessons: [
            { title: "Recetas y medidas", detail: "Disponible después", state: "next" },
            { title: "Repartos justos", detail: "Disponible después", state: "next" },
            { title: "Cierre de la unidad", detail: "Disponible después", state: "next" },
          ] },
        ],
      };

      function unitSummary(unit) {
        return `<strong>${unit.title}</strong><small>${unit.detail}</small>`;
      }

      function actionButtons(lesson, compact = false) {
        if (lesson.state === "current") {
          return `<button class="button primary" data-action="launch">Lanzar en vivo</button><button class="button" data-action="edit">Editar</button>`;
        }
        if (lesson.state === "done") {
          return `<button class="button" data-action="edit">Editar</button>`;
        }
        return `<button class="button" data-action="preview">Ver detalle</button>`;
      }

      function teacherActions(lesson) {
        if (lesson.state === "current") {
          return `<button class="button primary live-launch" data-action="launch">Lanzar en vivo</button>`;
        }
        if (lesson.state === "next") {
          return `<button class="button" data-action="advance">Adelantar aquí</button>`;
        }
        return "";
      }

      function header(label, description) {
        return `<header class="page-intro"><span class="variant-tag"><b>${label}</b> · ${variants[label].name}</span><p class="eyebrow" style="margin-top:26px">ROADMAP · VISTA DOCENTE</p><h1>${data.title}</h1><p class="lede">${description}</p></header>`;
      }

      function progressStrip() {
        return `<section class="panel progress-strip" aria-label="Progreso del roadmap"><div class="progress-copy"><strong>Tu grupo va en “Comparar fracciones”</strong><small>3 de 9 actividades completadas · avance de navegación, no calificación</small><div class="progress-bar"><i></i></div></div><div class="progress-number">33%</div></section>`;
      }

      function continuity(motion) {
        const active = motionOptions[motion] ? motion : "1";
        return `<div class="motion-picker" aria-label="Probar opciones de animación"><span>Probar animación:</span>${Object.entries(motionOptions).map(([key, option]) => `<button class="${key === active ? "active" : ""}" data-motion="${key}">${key} · ${option.label}</button>`).join("")}</div><div class="roadmap-continuity ${motionOptions[active].className}"><span class="continuity-dot" aria-hidden="true"></span><span class="continuity-copy"><small>Último punto del grupo</small><strong>Comparar fracciones</strong></span><button class="button" data-action="continue">Continuar</button></div><p class="continuity-caption">${motionOptions[active].caption}</p>`;
      }

      function renderA() {
        return `<main class="variant-a"><div class="shell"><div class="topbar"><div class="brand">Aula<span>Lista</span></div><nav><button class="nav-link active">Roadmap</button><button class="nav-link">Currícula</button></nav></div>${header("A", "Un camino visible, motivador y centrado en el siguiente paso. La actividad actual siempre tiene una acción grande y fácil de encontrar.")}<section class="panel a-hero"><div><p class="eyebrow">SIGUIENTE PASO</p><h2>Compara fracciones</h2><p class="lede">La maestra puede abrir la actividad actual cuando el grupo esté listo.</p><button class="button primary" data-action="launch">Lanzar en vivo <span aria-hidden="true">→</span></button></div><div class="streak"><strong>3</strong><small>actividades<br />completas</small></div></section>${progressStrip()}<section class="panel a-path" aria-label="Camino de unidades">${data.units.map((unit, index) => `<article class="a-unit ${unit.state === "ACTUAL" ? "current" : unit.state === "COMPLETADA" ? "done" : ""}"><div class="a-node">${unit.state === "COMPLETADA" ? "✓" : index + 1}</div><div class="a-card ${unit.state === "ACTUAL" ? "current-card" : ""}"><h3>${unit.title}</h3><p>${unit.detail}</p>${unit.state === "ACTUAL" ? `<button class="button" data-action="expand">Ver actividades</button>` : ""}</div></article>`).join("")}</section><p class="prototype-note">Variante A: prioriza motivación, progreso y una acción inmediata. Puede sentirse más “juego” que herramienta docente.</p></div></main>`;
      }

      function renderB() {
        return `<main class="variant-b"><div class="shell"><div class="topbar"><div class="brand">Aula<span>Lista</span></div><nav><button class="nav-link active">Roadmap</button><button class="nav-link">Currícula</button></nav></div>${header("B", "Una ruta compacta para ver unidades y lecciones de un vistazo. Cada unidad se abre sólo cuando la maestra quiere revisar sus actividades.")}<div class="b-layout"><aside class="b-sidebar"><h2>Unidades</h2><ul>${data.units.map((unit, index) => `<li class="${index === 1 ? "current" : ""}">${String(index + 1).padStart(2, "0")} · ${unit.title}</li>`).join("")}</ul></aside><section><div class="b-heading"><div><h2>Camino actual</h2><p>Elige una unidad para continuar.</p></div><button class="button" data-action="tour">Recorrido inicial</button></div>${progressStrip()}<div class="b-route" style="margin-top:14px">${data.units.map((unit, index) => `<details class="b-unit" ${index === 1 ? "open" : ""}><summary><span class="b-unit-title"><span class="b-unit-number">${index + 1}</span><span>${unitSummary(unit)}</span></span><span aria-hidden="true">⌄</span></summary><div class="b-lessons">${unit.lessons.map(lesson => `<article class="b-lesson ${lesson.state}"><div><h3>${lesson.title}</h3><p>${lesson.detail}</p></div>${actionButtons(lesson, true)}</article>`).join("")}</div></details>`).join("")}</div></section></div><p class="prototype-note">Variante B: prioriza densidad y exploración rápida. Puede requerir más lectura para identificar la siguiente acción.</p></div></main>`;
      }

      function renderC() {
        return `<main class="variant-c"><div class="shell"><div class="topbar"><div class="brand">Aula<span>Lista</span></div><nav><button class="nav-link active">Roadmap</button><button class="nav-link">Currícula</button></nav></div>${header("C", "La propuesta propia: jerarquía tranquila, estados escritos y acciones docentes sólo donde corresponden. El roadmap orienta; la edición y el lanzamiento viven en el punto seleccionado.")}<div class="c-layout"><section class="panel c-roadmap"><div class="c-roadmap-header"><div><p class="eyebrow">ROADMAP PUBLICADO</p><h2>Camino del grupo</h2><p>9 actividades · última revisión hoy</p></div><button class="button" data-action="tour">Cómo editar</button></div><section class="panel progress-strip c-progress-strip" aria-label="Contexto del roadmap"><div class="progress-copy"><strong>El grupo está en “Comparar fracciones”</strong><small>3 actividades trabajadas · el maestro puede elegir otro punto cuando lo necesite</small><div class="progress-bar"><i></i></div></div><div class="progress-number">33%</div></section>${data.units.map((unit, index) => `<details class="c-unit" ${index === 1 ? "open" : ""}><summary><span class="c-chevron" aria-hidden="true">›</span><span><span class="c-unit-number">UNIDAD ${String(index + 1).padStart(2, "0")}</span><br />${unitSummary(unit)}</span><span class="c-unit-state">${unit.state}</span></summary><div class="c-lessons">${unit.lessons.map(lesson => `<article class="c-lesson ${lesson.state}"><div><h4>${lesson.title}</h4><p>${lesson.detail}</p>${lesson.completedAt ? `<small class="c-completed-at">Completada el ${lesson.completedAt} · ${lesson.participants} ${lesson.participants === 1 ? "alumno" : "alumnos"} participaron</small>` : ""}</div><div class="c-actions">${teacherActions(lesson)}</div></article>`).join("")}</div></details>`).join("")}</section><aside class="c-side"><section class="panel next-action"><h2>Siguiente acción</h2><strong>Comparar fracciones</strong><p>Último recorrido: “Comprobar lo aprendido”, completada el 22 ago 2026.</p><button class="button primary" data-action="launch">Lanzar en vivo</button></section><section class="panel next-session"><p class="eyebrow">PRÓXIMA SESIÓN</p><h2>Continuar con el grupo</h2><strong>Último punto elegido: Comparar fracciones</strong><p>Es una sugerencia de orientación; no modifica tu Roadmap.</p><button class="button primary" data-action="continue">Continuar desde aquí</button><button class="button" data-action="choose">Elegir otro punto</button></section><section class="panel"><h2>Estados del camino</h2><ul><li><strong>Completada</strong>: ya se trabajó en el recorrido.</li><li><strong>Actual</strong>: siguiente paso del grupo.</li><li><strong>Disponible</strong>: todavía no es el turno.</li></ul></section></aside></div><p class="prototype-note">Variante C: prioriza claridad docente, control para adelantar y autoridad humana. Es la propuesta más alineada con el flujo Roadmap → Editar/Lanzar.</p></div></main>`;
      }

      function updateUrl(key) {
        const url = new URL(window.location.href);
        url.searchParams.set("variant", key);
        window.history.replaceState({}, "", url);
        render(key, url.searchParams.get("motion") || "1");
      }

      function updateMotion(motion) {
        const url = new URL(window.location.href);
        const active = variants[url.searchParams.get("variant")] ? url.searchParams.get("variant") : "A";
        url.searchParams.set("variant", active);
        url.searchParams.set("motion", motion);
        window.history.replaceState({}, "", url);
        render(active, motion);
      }

      function render(key, motion = "1") {
        const active = variants[key] ? key : "A";
        const body = active === "A" ? renderA() : active === "B" ? renderB() : renderC();
        document.getElementById("app").innerHTML = body + `<div class="switcher" aria-label="Cambiar opción de roadmap"><button data-switch="prev" aria-label="Opción anterior">←</button><span class="switcher-label"><strong>${active}</strong> · ${variants[active].name}</span><button data-switch="next" aria-label="Opción siguiente">→</button></div>`;
        if (active === "C") document.querySelectorAll(".next-session").forEach(card => card.remove());
        document.querySelectorAll("[data-switch]").forEach(button => button.addEventListener("click", () => {
          const keys = Object.keys(variants); const index = keys.indexOf(active); const next = button.dataset.switch === "next" ? (index + 1) % keys.length : (index + keys.length - 1) % keys.length; updateUrl(keys[next]);
        }));
        document.querySelectorAll("[data-motion]").forEach(button => button.addEventListener("click", () => updateMotion(button.dataset.motion)));
        document.querySelectorAll("[data-action]").forEach(button => button.addEventListener("click", () => {
          if (button.dataset.action === "advance") {
            showAdvanceConfirmation(button);
            return;
          }
          const messages = { launch: "Demo: la actividad está lista para lanzar en vivo.", continue: "Demo: la siguiente sesión usaría este último recorrido.", choose: "Demo: se abriría el Roadmap para elegir otro punto.", edit: "Demo: abriría la edición sencilla de esta actividad.", preview: "Demo: mostraría el detalle de la actividad.", tour: "Demo: aquí iniciaría el recorrido de primera edición.", expand: "Demo: se expandirían las actividades de esta unidad." };
          const status = document.createElement("div"); status.className = "status shell"; status.textContent = messages[button.dataset.action]; button.closest("main").prepend(status); setTimeout(() => status.remove(), 2200);
        }));
      }

      function showAdvanceConfirmation(button) {
        const target = button.closest(".c-lesson")?.querySelector("h4")?.textContent || "esta actividad";
        const backdrop = document.createElement("div");
        backdrop.className = "confirm-backdrop";
        backdrop.innerHTML = `<section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="advance-title"><h2 id="advance-title">¿Adelantar el grupo?</h2><p>Ahora van en <strong>“Comprobar lo aprendido”</strong>. Se moverán a <strong>“${target}”</strong>.</p><div class="confirm-actions"><button class="button" data-confirm="cancel">Cancelar</button><button class="button primary" data-confirm="advance">Adelantar</button></div></section>`;
        document.body.append(backdrop);
        const close = () => backdrop.remove();
        backdrop.querySelector('[data-confirm="cancel"]').addEventListener("click", close);
        backdrop.querySelector('[data-confirm="advance"]').addEventListener("click", () => {
          close();
          const status = document.createElement("div"); status.className = "status shell"; status.textContent = `Demo: el grupo se adelantaría a “${target}”.`; button.closest("main").prepend(status); setTimeout(() => status.remove(), 2200);
        });
        backdrop.addEventListener("click", event => { if (event.target === backdrop) close(); });
        backdrop.querySelector('[data-confirm="cancel"]').focus();
      }

      document.addEventListener("keydown", event => {
        if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        const keys = Object.keys(variants); const active = new URL(window.location.href).searchParams.get("variant") || "A"; const index = keys.indexOf(active); const delta = event.key === "ArrowRight" ? 1 : -1; updateUrl(keys[(index + delta + keys.length) % keys.length]);
      });

      render(new URL(window.location.href).searchParams.get("variant") || "A", new URL(window.location.href).searchParams.get("motion") || "1");
    </script>
  </body>
</html>
